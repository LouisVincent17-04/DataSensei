[program:datasensei-ml-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/datasensei/artisan queue:work machine_learning --queue=machine-learning --sleep=1 --tries=2 --timeout=900 --max-time=3600
directory=/var/www/datasensei
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/datasensei/storage/logs/ml-worker.log
stopwaitsecs=930
